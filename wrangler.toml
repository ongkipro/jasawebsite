# JASAWEBSITE.co — Cloudflare Pages + Workers (PRD §33.2)
name = "jasawebsite-co"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

# ── Bindings ────────────────────────────────────────────────
# Buat dulu: wrangler d1 create jasawebsite   → salin database_id
[[d1_databases]]
binding = "DB"
database_name = "jasawebsite"
database_id = "REPLACE_WITH_D1_ID"

# Buat dulu: wrangler r2 bucket create jasawebsite-assets
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "jasawebsite-assets"

# Buat dulu: wrangler kv namespace create CACHE   → salin id
[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_KV_ID"

# Postgres client portal — Hyperdrive (prod). Buat dulu:
#   wrangler hyperdrive create jasawebsite-pg --connection-string="postgres://user:pass@host:5432/db"
# Dev (astro dev) pakai DATABASE_URL di .dev.vars, binding ini di-skip.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "REPLACE_WITH_HYPERDRIVE_ID"
localConnectionString = "postgres://postgres:devpass@localhost:5434/jasawebsite"

# ── Vars publik (non-sensitif) ──────────────────────────────
# Secrets via: wrangler secret put RESEND_API_KEY / AUTH_SECRET /
#   TURNSTILE_SECRET_KEY / SANITY_WEBHOOK_SECRET (PRD §33.3)
[vars]
SITE_URL = "https://jasawebsite.co"
DEFAULT_LOCALE = "id"
WHATSAPP_NUMBER = "6282136093430" # nomor WA bisnis
